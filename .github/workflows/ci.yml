name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meritmatrix-backend/backend/requirements.txt
      - name: Install backend dependencies
        working-directory: meritmatrix-backend/backend
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: meritmatrix-backend/backend
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: meritmatrix-frontend/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: meritmatrix-frontend/frontend
        run: npm ci
      - name: Build frontend
        working-directory: meritmatrix-frontend/frontend
        run: npm run build
