services:
  backend:
    build:
      context: ./backend
      target: production
    image: meritmatrix-backend:production
    container_name: meritmatrix-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    init: true
    security_opt:
      - no-new-privileges:true
